<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blankfire</title>
  <link rel="stylesheet" href="../content/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="id">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M57 5C61 25 79 38 79 62A29 29 0 0 1 21 62C21 47 28 38 36 31C37 39 41 43 45 45C43 31 49 17 57 5ZM50 48.5A13.5 13.5 0 0 1 50 75.5A13.5 13.5 0 0 1 50 48.5Z"/></svg>
        <span class="brand">Blankfire</span>
        <span class="live"><i></i>dinero ficticio</span>
      </div>
      <div class="top-r">
        <div class="since" id="since"></div>
        <button class="lang-btn" data-act="lang" aria-label="Switch to English" title="Switch to English">EN</button>
        <button class="help-btn" data-act="tour" aria-label="Recorrido guiado" title="Recorrido guiado"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.3"/><path d="M6.3 6.3a1.8 1.8 0 113 1.3c-.6.4-1.3.8-1.3 1.6v.2M8 11.4v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <section class="summary" aria-label="Resumen de la cuenta">
      <div class="sum-main">
        <div class="sum-eq">
          <span class="lbl">Patrimonio</span>
          <div class="eqline"><span class="big num" id="equity">—</span><span class="delta num" id="equityDelta"></span></div>
        </div>
        <div class="spark" id="spark" aria-hidden="true"></div>
      </div>
      <dl class="facts">
        <div><dt>Libre</dt><dd class="num" id="free">—</dd></div>
        <div><dt>En juego</dt><dd class="num" id="inPos">—</dd></div>
        <div><dt>Abierto</dt><dd class="num" id="openPnl">—</dd></div>
      </dl>
    </section>

    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="wallet" aria-selected="true">Cartera</button>
      <button role="tab" data-tab="history" aria-selected="false">Historial</button>
      <button role="tab" data-tab="stats" aria-selected="false">Estadísticas</button>
      <button role="tab" data-tab="settings" aria-selected="false">Ajustes</button>
      <span class="tab-ink" aria-hidden="true"></span>
    </nav>

    <main class="views">
      <section class="view" data-view="wallet" role="tabpanel"></section>
      <section class="view" data-view="history" role="tabpanel" hidden></section>
      <section class="view" data-view="stats" role="tabpanel" hidden></section>
      <section class="view" data-view="settings" role="tabpanel" hidden></section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
